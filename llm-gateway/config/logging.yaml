# Logging configuration.
# The configure_logging() function reads the level from app settings, not
# from this file. This file documents the intended structure and can be
# consumed by external log shippers (Fluentd, Vector, etc.).

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.json.JsonFormatter
    format: "%(timestamp)s %(level)s %(name)s %(message)s %(request_id)s"

handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    level: INFO

root:
  level: INFO
  handlers: [stdout]

loggers:
  uvicorn.access:
    level: WARNING
  uvicorn.error:
    level: WARNING
  httpx:
    level: WARNING
