# Development environment settings.
# These values are overridden by environment variables (case-insensitive).
# New multi-model configuration schema (complexity-based tiers with mixed providers):
# models:
#   <tier_name>:                    # e.g., "simple", "complex" (complexity-based, NOT provider-based)
#     routing_strategy: <strategy>  # "cost_optimized" | "quality_optimized" | "latency_optimized" | "balanced"
#     enabled: true                 # Enable/disable entire tier
#     fallback_tier: <tier_name>    # Optional: tier to fall back to if ALL providers in this tier fail
#     providers:                    # List of providers (can mix local AND cloud in same tier)
#       - name: <provider_entry_id> # Unique identifier for this provider entry
#         provider: <provider_name> # e.g., "nvidia", "openai", "anthropic", "ollama"
#         provider_kind: <kind>     # "local" | "cloud"
#         base_url: <url>           # API base URL for this provider
#         api_key_env: <env_var>    # Environment variable name for API key (never store raw keys in YAML)
#         model: <model_id>         # Model identifier
#         enabled: true             # Enable/disable this provider/model
#         priority: 1               # Lower = higher priority (tried first within tier)
#         max_tokens: 4096          # Optional: max tokens for this model
#         cost_per_1k: 0.001        # Optional: cost per 1k tokens (used by cost_optimized strategy)
#         params:                   # Optional: generation parameters
#           temperature: 0.3
#           top_p: 0.9
# Legacy flat keys (cloud_provider_*, local_provider_*) are still supported for backward compatibility
# but will show a deprecation warning. They are auto-synthesized into the new models block.

app_name: "LLM Gateway"
app_env: "dev"
app_host: "0.0.0.0"
app_port: 8000
app_log_level: "INFO"
app_request_timeout_seconds: 30

# New multi-model configuration schema - COMPLEXITY-BASED TIERS
models:
  simple:
    routing_strategy: "cost_optimized"
    enabled: true
    fallback_tier: "complex"
    providers:
      # Fast/cheap cloud model - first priority
      - name: "nvidia-nano"
        provider: "nvidia"
        provider_kind: "cloud"
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
        enabled: true
        priority: 1
        max_tokens: 4096
        cost_per_1k: 0.0001
        timeout_seconds: 60.0
        params:
          temperature: 0.3
          top_p: 0.9
      
      # Fast local model - second priority
      - name: "ollama-fast"
        provider: "ollama"
        provider_kind: "local"
        base_url: "http://localhost:11434"
        api_key_env: null
        model: "llama3.2"
        enabled: false
        priority: 2
        max_tokens: 4096
        cost_per_1k: 0.0
        timeout_seconds: 60.0
        params:
          temperature: 0.3
          top_p: 0.9

  complex:
    routing_strategy: "quality_optimized"
    enabled: false
    fallback_tier: null
    providers:
      # More capable cloud model - first priority
      - name: "nvidia-large"
        provider: "nvidia"
        provider_kind: "cloud"
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key_env: "NVIDIA_API_KEY"
        model: "nvidia/minimax-m2.7"
        enabled: true
        priority: 1
        max_tokens: 8192
        cost_per_1k: 0.0005
        timeout_seconds: 30.0
        params:
          temperature: 0.5
          top_p: 0.95
      
      # More capable local model - second priority
      - name: "ollama-large"
        provider: "ollama"
        provider_kind: "local"
        base_url: "http://localhost:11434"
        api_key_env: null
        model: "llama3.1"
        enabled: false
        priority: 2
        max_tokens: 8192
        cost_per_1k: 0.0
        timeout_seconds: 60.0
        params:
          temperature: 0.5
          top_p: 0.95

# Legacy flat keys (deprecated but still supported for backward compatibility)
cloud_provider_api_key: ""
cloud_provider_base_url: "https://integrate.api.nvidia.com/v1"
cloud_provider_model: "nemotron-3-nano-30b-a3b"
cloud_provider_models:
  - "nvidia/nemotron-3-nano-30b-a3b"
  - "nvidia/llama-3.1-nemotron-70b-instruct"
cloud_provider_timeout_seconds: 15
cloud_provider_max_retries: 3

local_provider_base_url: "http://localhost:11434"
local_provider_model: "llama3.2"
local_provider_models:
  - "llama3.2"
  - "llama3.1"
  - "mistral:7b"
local_provider_timeout_seconds: 60

cache_enabled: true
cache_similarity_threshold: 0.92
cache_ttl_seconds: 3600
cache_embedder_kind: "sentence_transformer"

